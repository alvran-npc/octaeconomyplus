settings:
  default-duration-hours: 48
  maximum-duration-hours: 168
  tax-percent: 5.0
  listing-fee: 0.0
  minimum-price: 1.0
  maximum-price: 1000000000.0
  listings-per-player: 5
  allowed-currencies:
    - vault
    - "*" # Allow any currency ID currently registered by ExcellentEconomy.
    # Remove "*" and list exact IDs below if you want an allowlist.
    # - coins
    # - gems
    # - tokens
  expire-check-seconds: 30
  blacklist:
    materials: []
    name-keywords: []
    lore-keywords: []
    worlds: []

currency-limits:
  vault:
    minimum: 1.0
    maximum: 1000000000.0
  # Copy this section and replace the key with each ExcellentEconomy currency ID.
  # coins:
  #   minimum: 1.0
  #   maximum: 1000000000000.0
