# Visual-only Roulette wheel animation. The result is fixed before the wheel menu opens.
enabled: true
# Extra full rotations of the 37-pocket wheel before it settles on the result (0-3).
laps: 1
# Ticks between pocket steps while the wheel is fast, and the slowest step at the end.
start-interval-ticks: 1
maximum-interval-ticks: 8
# Number of final steps over which the wheel decelerates.
slowdown-steps: 14
# How long the result stays on the wheel menu before returning to the table (ticks).
result-hold-ticks: 60
