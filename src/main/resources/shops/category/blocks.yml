# The plugin expands this seed file into a complete editable catalogue on first startup/reload.
category:
  id: blocks
  display-name: "&aBlocks"
  icon: GRASS_BLOCK
  slot: 10
  permission: ""
  auto-include-vanilla: true
  # Used only to create missing item entries. Each generated entry is saved below with explicit prices.
  catalog-defaults:
    buy-base: 8.00
    sell-ratio: 0.22
    currency: vault
items:
  stone:
    material: STONE
    buy-price: 10.0
    sell-price: 3.0
    currency: vault
  oak_log:
    material: OAK_LOG
    buy-price: 8.0
    sell-price: 2.0
    currency: vault
  cobblestone:
    material: COBBLESTONE
    buy-price: 5.0
    sell-price: 1.0
    currency: vault
