# The plugin expands this seed file into a complete editable catalogue on first startup/reload.
category:
  id: redstone
  display-name: "&cRedstone"
  icon: REDSTONE
  slot: 13
  permission: ""
  auto-include-vanilla: true
  # Used only to create missing item entries. Each generated entry is saved below with explicit prices.
  catalog-defaults:
    buy-base: 22.00
    sell-ratio: 0.25
    currency: vault
items:
  redstone:
    material: REDSTONE
    buy-price: 6.0
    sell-price: 1.5
    currency: vault
  repeater:
    material: REPEATER
    buy-price: 25.0
    sell-price: 6.0
    currency: vault
  piston:
    material: PISTON
    buy-price: 40.0
    sell-price: 10.0
    currency: vault
