# The plugin expands this seed file into a complete editable catalogue on first startup/reload.
category:
  id: colored_blocks
  display-name: "&dColored Blocks"
  icon: PURPLE_WOOL
  slot: 11
  permission: ""
  auto-include-vanilla: true
  # Used only to create missing item entries. Each generated entry is saved below with explicit prices.
  catalog-defaults:
    buy-base: 12.00
    sell-ratio: 0.25
    currency: vault
items:
  white_wool:
    material: WHITE_WOOL
    buy-price: 12.0
    sell-price: 3.0
    currency: vault
  red_wool:
    material: RED_WOOL
    buy-price: 12.0
    sell-price: 3.0
    currency: vault
  glass:
    material: GLASS
    buy-price: 8.0
    sell-price: 2.0
    currency: vault
