# The plugin expands this seed file into a complete editable catalogue on first startup/reload.
category:
  id: decoration
  display-name: "&eDecoration"
  icon: FLOWER_POT
  slot: 12
  permission: ""
  auto-include-vanilla: true
  # Used only to create missing item entries. Each generated entry is saved below with explicit prices.
  catalog-defaults:
    buy-base: 16.00
    sell-ratio: 0.25
    currency: vault
items:
  torch:
    material: TORCH
    buy-price: 4.0
    sell-price: 1.0
    currency: vault
  lantern:
    material: LANTERN
    buy-price: 20.0
    sell-price: 5.0
    currency: vault
  bookshelf:
    material: BOOKSHELF
    buy-price: 35.0
    sell-price: 8.0
    currency: vault
