config-version: 2
language: en
debug: false
database:
  type: sqlite
  sqlite-file: data/auction.db
  mysql:
    host: 127.0.0.1
    port: 3306
    database: octaeconomy
    username: root
    password: change-me
    use-ssl: false
economy:
  default-currency: vault
  currency-display:
    vault: "$"
shop:
  click-actions:
    left: buy
    right: sell
  dynamic-price:
    enabled: false
    fluctuation-percent: 2.0
    min-multiplier: 0.75
    max-multiplier: 1.50
    recovery-per-hour: 0.02
  daily-limit:
    enabled: false
    default-amount: 0
  sell-multiplier:
    enabled: true
sound:
  enabled: true
  click: UI_BUTTON_CLICK
  success: ENTITY_EXPERIENCE_ORB_PICKUP
  error: BLOCK_NOTE_BLOCK_BASS
transaction-log:
  enabled: false
  max-files: 7
